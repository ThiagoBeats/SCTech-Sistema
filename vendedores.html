<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vendedores/Arquitetos - SCTech</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css?v=20261211a">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sc_tema')||'light');document.documentElement.setAttribute('data-sidebar',localStorage.getItem('sc_sidebar')||'expanded')</script>
</head>
<body>
    <aside class="sidebar" id="main-sidebar"></aside>
    <main class="main">
        <div class="header"><h2>Vendedores/Arquitetos</h2></div>

        <!-- Tipo de cadastro: as duas abas mostram a mesma lista (db.vendedores),
             filtrada pelo campo tipo. Tudo abaixo respeita a escolha. -->
        <div class="tab-nav vend-tipo-nav">
            <button class="tab-btn vend-tipo-btn active" data-tipo="vendedor"  onclick="mostrarTipoVendedores('vendedor')">👤 Vendedores</button>
            <button class="tab-btn vend-tipo-btn"        data-tipo="arquiteto" onclick="mostrarTipoVendedores('arquiteto')">📐 Arquitetos</button>
        </div>

        <div class="tab-nav vend-sub-nav">
            <button class="tab-btn vend-tab-btn active" data-tab="lista"     onclick="mostrarTabVendedores('lista')">📋 Cadastro</button>
            <button class="tab-btn vend-tab-btn"        data-tab="comissoes" onclick="mostrarTabVendedores('comissoes')">💰 Comissões</button>
        </div>

        <!-- TAB: VENDEDORES -->
        <div id="tab-vend-lista" class="tab-panel active">
            <div class="card">
                <h3 id="vend-form-titulo">Cadastrar Vendedor</h3>
                <div class="grid" style="margin-top:15px">
                    <div class="form-group">
                        <label>Nome</label>
                        <input type="text" id="vend-nome" placeholder="Nome">
                    </div>
                    <div class="form-group">
                        <label>Comissão (%)</label>
                        <input type="number" id="vend-comissao" value="0" step="0.5" min="0" max="100" placeholder="Ex: 5">
                    </div>
                    <div class="form-group">
                        <label>Telefone / WhatsApp</label>
                        <input type="text" id="vend-tel" placeholder="Ex: (11) 99999-9999">
                    </div>
                    <div class="form-group">
                        <label>Usuário do sistema</label>
                        <select id="vend-usuario">
                            <option value="">— Sem conta de acesso —</option>
                        </select>
                        <small style="font-size:11px;color:var(--muted);margin-top:4px">Os alertas dos pedidos deste cadastro vão para esta conta.</small>
                    </div>
                </div>
                <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:10px">
                    <button class="btn" id="vend-btn-salvar" onclick="salvarVendedor()">Salvar Vendedor</button>
                    <button class="btn btn-outline" id="vend-btn-cancelar" style="display:none" onclick="cancelarEdicaoVendedor()">Cancelar</button>
                </div>
            </div>
            <div class="card">
                <table>
                    <thead>
                        <tr>
                            <th>Nome</th>
                            <th style="width:110px;text-align:center">Comissão</th>
                            <th>Telefone</th>
                            <th style="width:80px;text-align:center">Pedidos</th>
                            <th>Situação</th>
                            <th class="td-acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tb-vendedores"></tbody>
                </table>
            </div>
        </div>

        <!-- TAB: COMISSÕES (registro do pedido: registrada, pendente, paga) -->
        <div id="tab-vend-comissoes" class="tab-panel">
            <div class="card">
                <div style="display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:14px">
                    <div style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
                        <div>
                            <label style="display:block;font-size:12px;margin-bottom:4px">Vendedor</label>
                            <select id="com-filtro-vend" onchange="renderComissoes()" style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;min-width:180px"></select>
                        </div>
                        <div>
                            <label style="display:block;font-size:12px;margin-bottom:4px">Mês</label>
                            <select id="com-filtro-mes" onchange="renderComissoes()" style="padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;min-width:180px"></select>
                        </div>
                    </div>
                    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
                        <span id="com-sel-resumo" style="font-size:14px;color:var(--text-soft)"></span>
                        <button class="btn btn-success" id="com-btn-pagar" onclick="registrarPagamentoComissoesSelecionadas()" disabled>Registrar pagamento</button>
                    </div>
                </div>
                <div id="com-cartoes" style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px"></div>
                <table>
                    <thead>
                        <tr>
                            <th style="width:30px"><input type="checkbox" id="com-sel-todos" onchange="comSelecionarTodos(this.checked)" title="Selecionar os pendentes"></th>
                            <th>Data</th>
                            <th>Pedido</th>
                            <th>Cliente</th>
                            <th>Vendedor</th>
                            <th>Valor do pedido</th>
                            <th>%</th>
                            <th>Comissão</th>
                            <th>Status</th>
                            <th>Pago em</th>
                            <th class="td-acoes"></th>
                        </tr>
                    </thead>
                    <tbody id="tb-comissoes"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="js/etiquetas-core.js?v=20261211a"></script>
    <script src="js/etiquetas-render.js?v=20261211a"></script>
    <script src="js/cortina-desenho.js?v=20261211a"></script>
    <script src="js/docs-layout-core.js?v=20261211a"></script>
    <script src="js/financeiro-core.js?v=20261211a"></script>
    <script src="js/caixa-core.js?v=20261211a"></script>
    <script src="js/carrinho-core.js?v=20261211a"></script>
    <script src="js/resultado-core.js?v=20261211a"></script>
    <script src="js/fechamento-core.js?v=20261211a"></script>
    <script src="js/simulador-core.js?v=20261211a"></script>
    <script src="js/rotas-core.js?v=20261211a"></script>
    <script src="js/endereco-core.js?v=20261211a"></script>
    <script src="js/agenda-core.js?v=20261211a"></script>
    <script src="js/notificacoes.js?v=20261211a"></script>
    <script src="js/feriados-core.js?v=20261211a"></script>
    <script src="js/fin-cat-core.js?v=20261211a"></script>
    <script src="js/dre-core.js?v=20261211a"></script>
    <script src="js/fluxo-core.js?v=20261211a"></script>
    <script src="js/conciliacao-core.js?v=20261211a"></script>
    <script src="js/fiscal-core.js?v=20261211a"></script>
    <script src="js/fiscal.js?v=20261211a"></script>
    <script src="js/mascaras-core.js?v=20261211a"></script>
    <script src="js/mascaras.js?v=20261211a"></script>
    <script src="js/bancos-base.js?v=20261211a"></script>
    <script src="js/bancos-core.js?v=20261211a"></script>
    <script src="js/app.js?v=20261211a"></script>
    <script src="js/agenda.js?v=20261211a"></script>
    <script src="js/rotas.js?v=20261211a"></script>
    <script src="js/compartilhar-doc.js?v=20261211a"></script>
</body>
</html>
