<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Produção - SCTech</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sc_tema')||'light')</script>
</head>
<body>
    <aside class="sidebar" id="main-sidebar">
        <div class="logo-popup-wrap" id="logo-popup-wrap"><div class="logo" onclick="toggleLogoPopup(event)"><img src="images/logo.png" alt="SCTech" class="sidebar-logo-img"><h2>SCTech</h2></div><div class="logo-popup" id="logo-popup"><div class="logo-popup-header"><div class="logo-popup-avatar">&#128100;</div><div><div class="logo-popup-name" id="popup-user-name">&#8212;</div><div class="logo-popup-role">Usu&#225;rio SCTech</div></div></div><div class="logo-popup-sep"></div><button class="logo-popup-item" onclick="toggleTema()" style="justify-content:space-between"><span style="display:flex;align-items:center;gap:10px"><span id="tema-icone">🌙</span> Tema</span><span class="tema-switch" id="tema-switch"></span></button><div class="logo-popup-sep"></div><a href="sobre.html" class="logo-popup-item"><span>&#8505;&#65039;</span> Sobre o Sistema</a><a href="empresa.html" class="logo-popup-item"><span>&#9881;&#65039;</span> Configurar Empresa</a><div class="logo-popup-sep"></div><button class="logo-popup-item logo-popup-logout" onclick="logout()"><span>&#128682;</span> Sair</button></div></div>
        <a href="index.html"    class="nav-item"><img src="images/icones/dashboard.png" class="nav-icon"> <span class="nav-text">Página Inicial</span></a>
        <a href="pcp.html"      class="nav-item active"><img src="images/icones/producao.png" class="nav-icon"> <span class="nav-text">Produção</span></a>
        <a href="estoque.html"  class="nav-item"><img src="images/icones/estoque.png" class="nav-icon"> <span class="nav-text">Estoque</span></a>
        <a href="clientes.html" class="nav-item"><img src="images/icones/clientes.png" class="nav-icon"> <span class="nav-text">Clientes</span></a><a href="catalogo.html" class="nav-item"><img src="images/icones/catalogo.png" class="nav-icon"> <span class="nav-text">Cadastro/Catálogo</span></a>
        <a href="relatorios.html" class="nav-item"><img src="images/icones/relatorios.png" class="nav-icon"> <span class="nav-text">Relatórios</span></a>
        <a href="vendedores.html" class="nav-item"><img src="images/icones/vendedores.png" class="nav-icon"> <span class="nav-text">Vendedores</span></a>
        <a href="fornecedores.html" class="nav-item"><img src="images/icones/fornecedores.png" class="nav-icon"> <span class="nav-text">Fornecedores</span></a>
        <a href="financeiro.html"   class="nav-item"><img src="images/icones/financeiro.png" class="nav-icon"> <span class="nav-text">Financeiro</span></a>
    </aside>
    <main class="main" style="overflow-x: hidden;">
        <div class="header">
            <h2>Painel de Produção</h2>
            <a href="pedido.html" class="btn btn-success">+ Novo Pedido</a>
        </div>

        <div class="tab-nav" style="margin-bottom:0">
            <button class="tab-btn active" id="tab-btn-kanban"   onclick="mostrarViewPCP('kanban')">📋 Status dos pedidos</button>
            <button class="tab-btn"        id="tab-btn-agenda"   onclick="mostrarViewPCP('agenda')">📅 Agenda de Instalações</button>
            <button class="tab-btn"        id="tab-btn-medicoes" onclick="mostrarViewPCP('medicoes')">📐 Agendamento de Medições</button>
        </div>

        <div id="pcp-view-kanban">
            <div id="aviso-orcamentos" class="aviso-orcamentos"></div>
            <!-- Filtros do Kanban -->
            <div style="display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:12px 0 4px">
                <div style="flex:1;min-width:160px">
                    <label style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px">Cliente</label>
                    <input id="kf-cliente" type="text" placeholder="🔍 Buscar cliente..."
                           style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px"
                           oninput="aplicarFiltroKanban()">
                </div>
                <div style="flex:1;min-width:140px">
                    <label style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px">Vendedor</label>
                    <select id="kf-vendedor"
                            style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:#fff"
                            onchange="aplicarFiltroKanban()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div style="flex:1;min-width:140px">
                    <label style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px">Tecido</label>
                    <select id="kf-tecido"
                            style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:#fff"
                            onchange="aplicarFiltroKanban()">
                        <option value="">Todos</option>
                    </select>
                </div>
                <div style="display:flex;align-items:flex-end;gap:8px;padding-bottom:1px">
                    <button class="btn btn-outline btn-sm" onclick="limparFiltroKanban()" style="white-space:nowrap">✕ Limpar</button>
                    <span id="kf-resultado" style="font-size:12px;color:#6b7280;white-space:nowrap;line-height:32px"></span>
                </div>
            </div>
            <div id="kanban-board" class="kanban-board"></div>
        </div>
        <div id="pcp-view-agenda" style="display:none">
            <div id="agenda-container"></div>
        </div>
        <div id="pcp-view-medicoes" style="display:none">
            <div class="card" style="margin-bottom:0">
                <h3 style="margin-bottom:18px;color:var(--primary)">Agendar Visita de Medição</h3>

                <!-- Tipo de cliente -->
                <div style="display:flex;gap:24px;margin-bottom:16px">
                    <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:600">
                        <input type="radio" name="med-tipo" value="existente" checked onchange="toggleTipoClienteMedicao()"> Cliente existente
                    </label>
                    <label style="display:flex;align-items:center;gap:7px;cursor:pointer;font-weight:600">
                        <input type="radio" name="med-tipo" value="novo" onchange="toggleTipoClienteMedicao()"> Novo cliente
                    </label>
                </div>

                <!-- Cliente existente -->
                <div id="med-grupo-existente">
                    <div class="form-group" style="max-width:400px">
                        <label>Cliente <span style="color:#dc2626">*</span></label>
                        <select id="med-cliente-id">
                            <option value="">— Selecione o cliente —</option>
                        </select>
                    </div>
                </div>

                <!-- Novo cliente inline -->
                <div id="med-grupo-novo" style="display:none">
                    <div class="grid" style="grid-template-columns:1fr 1fr;max-width:600px">
                        <div class="form-group">
                            <label>Nome do cliente <span style="color:#dc2626">*</span></label>
                            <input type="text" id="med-novo-nome" placeholder="Nome completo">
                        </div>
                        <div class="form-group">
                            <label>Telefone / WhatsApp</label>
                            <input type="text" id="med-novo-tel" placeholder="(11) 99999-9999">
                        </div>
                    </div>
                </div>

                <!-- Data / Hora / Endereço / Obs -->
                <div class="grid" style="grid-template-columns:180px 140px 1fr;margin-top:4px">
                    <div class="form-group">
                        <label>Data da visita <span style="color:#dc2626">*</span></label>
                        <input type="date" id="med-data">
                    </div>
                    <div class="form-group">
                        <label>Horário</label>
                        <input type="time" id="med-hora">
                    </div>
                    <div class="form-group">
                        <label>Endereço da visita <span style="color:#dc2626">*</span></label>
                        <input type="text" id="med-end" placeholder="Rua, nº, bairro, cidade…">
                    </div>
                </div>
                <div class="form-group" style="margin-top:0">
                    <label>Observações</label>
                    <input type="text" id="med-obs" placeholder="Referências, ponto de encontro, instruções…">
                </div>

                <button class="btn btn-success" onclick="salvarMedicao()">📐 Agendar Visita</button>
            </div>
            <div id="medicoes-container" style="margin-top:20px"></div>
        </div>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
