<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login - SCTech</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sc_tema')||'light')</script>
    <style>
        :root {
            --ls-ink: #0c2032;
            --ls-navy: #16324a;
            --ls-navy-2: #1f4260;
            --ls-steel: #4a7291;
            --ls-steel-light: #93b3c7;
            --ls-glow: #2fe0cf;
            --ls-glow-soft: #8ff2e6;
            --ls-paper: #f8f6f1;
            --ls-paper-line: #e6e1d5;
            --ls-text: #1c2b38;
        }
        html, body { height: 100%; }
        body.login-page {
            display: flex; flex-direction: row; align-items: stretch; justify-content: flex-start;
            height: 100vh; overflow: hidden; background: var(--ls-paper);
        }

        /* ── PAINEL VISUAL (assinatura: cortina plissada + trilho) ── */
        .ls-visual {
            position: relative; flex: 1 1 56%; min-width: 320px;
            background: linear-gradient(175deg, var(--ls-ink) 0%, var(--ls-navy) 58%, var(--ls-navy-2) 100%);
            display: flex; flex-direction: column; justify-content: space-between;
            overflow: hidden; padding: 44px 52px;
        }
        .ls-rail { position: relative; z-index: 3; display: flex; align-items: center; gap: 10px; margin-bottom: 2px; }
        .ls-rail::before { content:''; flex: 1; height: 2px; background: linear-gradient(90deg, rgba(147,179,199,.05), rgba(147,179,199,.55) 30%, rgba(147,179,199,.55) 70%, rgba(147,179,199,.05)); }
        .ls-rail-ring { width: 7px; height: 7px; border: 1.5px solid var(--ls-steel-light); border-radius: 50%; flex-shrink: 0; opacity: .8; }

        .ls-folds { position: absolute; inset: 0; z-index: 1; display: flex; }
        .ls-fold { flex: 1 1 0; position: relative; margin-right: -2.4%; }
        .ls-fold:last-child { margin-right: 0; }
        .ls-fold-glow { box-shadow: 0 0 60px 6px rgba(47,224,207,0.28); }
        @media (prefers-reduced-motion: no-preference) {
            .ls-fold-glow { animation: lsPulse 7s ease-in-out infinite; }
        }
        @keyframes lsPulse { 0%,100% { filter: brightness(1); } 50% { filter: brightness(1.22); } }

        .ls-brand { position: relative; z-index: 3; display: flex; align-items: center; gap: 12px; }
        .ls-brand img { height: 34px; width: auto; filter: drop-shadow(0 1px 3px rgba(0,0,0,.35)); }
        .ls-brand-mark { font-size: 21px; font-weight: 800; letter-spacing: -0.01em; color: #fff; }
        .ls-brand-mark b { font-weight: 300; color: var(--ls-glow-soft); }

        .ls-foot { position: relative; z-index: 3; }
        .ls-tagline { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ls-steel-light); }
        .ls-spec { margin-top: 12px; font-size: 12px; color: var(--ls-steel-light); letter-spacing: .01em; }
        .ls-spec b { color: var(--ls-glow-soft); font-weight: 700; }

        /* ── PAINEL DE FORMULÁRIO ── */
        .ls-form-side { flex: 1 1 44%; min-width: 340px; display: flex; align-items: center; justify-content: center; background: var(--ls-paper); padding: 40px; }
        .ls-form-box { width: 100%; max-width: 320px; }
        .ls-form-box h2 { font-size: 23px; font-weight: 700; color: var(--ls-text); margin-bottom: 5px; }
        .ls-form-box .ls-sub { font-size: 13px; color: #74838e; margin-bottom: 30px; }
        .ls-field { margin-bottom: 16px; }
        .ls-field label { display: block; font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #8b98a3; margin-bottom: 6px; }
        .ls-field input {
            width: 100%; padding: 11px 13px; border: 1px solid var(--ls-paper-line); border-radius: 5px;
            background: #fff; font-size: 14px; color: var(--ls-text); outline: none; font-family: inherit;
            transition: border-color .15s, box-shadow .15s;
        }
        .ls-field input:focus { border-color: var(--ls-steel); box-shadow: 0 0 0 3px rgba(74,114,145,0.14); }
        .ls-field input:focus-visible { outline: 2px solid var(--ls-glow); outline-offset: 1px; }
        .ls-btn {
            width: 100%; padding: 12px; border: none; border-radius: 5px; margin-top: 6px;
            background: var(--ls-navy); color: #fff; font-size: 14px; font-weight: 700; letter-spacing: .01em;
            cursor: pointer; font-family: inherit; transition: background .15s, transform .1s;
        }
        .ls-btn:hover { background: var(--ls-ink); }
        .ls-btn:active { transform: translateY(1px); }
        .ls-btn:focus-visible { outline: 2px solid var(--ls-steel); outline-offset: 2px; }
        .ls-error { background: #fdecea; color: #9c2b1f; border-left: 3px solid #c0392b; border-radius: 4px; padding: 9px 12px; font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }

        @media (max-width: 820px) {
            body.login-page { flex-direction: column; overflow-y: auto; height: auto; min-height: 100vh; }
            .ls-visual { flex: 0 0 auto; padding: 28px 26px 36px; min-height: 200px; }
            .ls-form-side { flex: 0 0 auto; padding: 32px 24px 48px; }
        }

        html[data-theme="dark"] .ls-form-side { background: #0e1520; }
        html[data-theme="dark"] .ls-form-box h2 { color: #f1f5f9; }
        html[data-theme="dark"] .ls-form-box .ls-sub { color: #7d8b97; }
        html[data-theme="dark"] .ls-field label { color: #7d8b97; }
        html[data-theme="dark"] .ls-field input { background: #0b1220; border-color: #26374a; color: #e8edf2; }
        html[data-theme="dark"] .ls-error { background: #3a1512; color: #f2a89e; border-left-color: #c0392b; }
    </style>
</head>
<body class="login-page">
    <div class="ls-visual">
        <div class="ls-folds" aria-hidden="true">
            <div class="ls-fold" style="background:#122a3f; clip-path:polygon(0 0,100% 0,58% 68%,42% 68%);"></div>
            <div class="ls-fold" style="background:#1c3c56; clip-path:polygon(0 0,100% 0,64% 78%,36% 78%);"></div>
            <div class="ls-fold" style="background:#2a5372; clip-path:polygon(0 0,100% 0,55% 64%,45% 64%);"></div>
            <div class="ls-fold ls-fold-glow" style="background:linear-gradient(200deg,#2a5372 0%,#22a99c 65%,#2fe0cf 100%); clip-path:polygon(0 0,100% 0,60% 82%,40% 82%);"></div>
            <div class="ls-fold" style="background:#2a5372; clip-path:polygon(0 0,100% 0,53% 66%,47% 66%);"></div>
            <div class="ls-fold" style="background:#1c3c56; clip-path:polygon(0 0,100% 0,62% 73%,38% 73%);"></div>
            <div class="ls-fold" style="background:#122a3f; clip-path:polygon(0 0,100% 0,57% 62%,43% 62%);"></div>
        </div>

        <div>
            <div class="ls-rail"><span class="ls-rail-ring"></span><span class="ls-rail-ring"></span></div>
            <div class="ls-brand" style="margin-top:16px">
                <img src="images/logo.png" alt="SCTech">
                <span class="ls-brand-mark">SC<b>Tech</b></span>
            </div>
        </div>

        <div class="ls-foot">
            <div class="ls-tagline">Sistema de Gestão para Cortineiros</div>
            <div class="ls-spec">Prega Wave &middot; Fator <b>2.0&times;</b> &middot; corte sob medida, do orçamento à instalação</div>
        </div>
    </div>

    <div class="ls-form-side">
        <div class="ls-form-box">
            <h2>Entrar</h2>
            <p class="ls-sub">Acesse o painel de gestão da sua confecção.</p>
            <div class="ls-field">
                <label for="login-usuario">E-mail</label>
                <input type="email" id="login-usuario" placeholder="seu@email.com" autocomplete="username"
                       onkeydown="if(event.key==='Enter') document.getElementById('login-senha').focus()">
            </div>
            <div class="ls-field">
                <label for="login-senha">Senha</label>
                <input type="password" id="login-senha" placeholder="Sua senha" autocomplete="current-password"
                       onkeydown="if(event.key==='Enter') realizarLogin()">
            </div>
            <div id="login-erro" class="ls-error" style="display:none"></div>
            <button class="ls-btn" onclick="realizarLogin()">Entrar</button>
        </div>
    </div>
    <script src="js/app.js"></script>
</body>
</html>
