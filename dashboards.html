<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboards - SCTech</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sc_tema')||'light')</script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        body { display:block; height:auto; margin:0; padding:0; background:var(--light); font-family:inherit; overflow-x:hidden; overflow-y:auto; }
        #dash-topbar { display:flex; align-items:center; gap:12px; padding:10px 24px; background:var(--white); border-bottom:1px solid var(--border); position:sticky; top:0; z-index:200; flex-wrap:wrap; }
        #dash-topbar .dash-logo { font-weight:800; font-size:16px; color:var(--primary); display:flex; align-items:center; gap:8px; margin-right:8px; }
        #dash-topbar .dash-logo img { height:26px; }
        .dash-tab-bar { display:flex; gap:3px; flex:1; flex-wrap:wrap; }
        .dash-tab { padding:6px 14px; border:1px solid var(--border); border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; background:transparent; color:#6b7280; transition:all .15s; white-space:nowrap; }
        .dash-tab:hover { background:var(--light); color:var(--dark); }
        .dash-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        #dash-filters { padding:10px 24px; background:var(--white); border-bottom:1px solid var(--border); display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; }
        #dash-filters label { font-size:11px; font-weight:600; color:#6b7280; display:block; margin-bottom:3px; }
        #dash-filters select, #dash-filters input[type=date], #dash-filters input[type=text] { padding:5px 9px; border:1px solid var(--border); border-radius:6px; font-size:12px; background:var(--white); color:var(--dark); }
        .dash-filter-btn { padding:5px 14px; border:none; border-radius:6px; font-size:12px; font-weight:600; cursor:pointer; }
        .dash-filter-btn-primary { background:var(--primary); color:#fff; }
        .dash-filter-btn-outline { background:transparent; border:1px solid var(--border); color:#6b7280; }
        #dash-content { padding:20px 24px; }
        .dkpi-grid { display:grid; gap:12px; margin-bottom:20px; }
        .dkpi { border-radius:10px; padding:14px 18px; color:#fff; }
        .dkpi-label { font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; opacity:.85; margin-bottom:4px; }
        .dkpi-value { font-size:20px; font-weight:800; line-height:1.1; }
        .dkpi-sub { font-size:10px; opacity:.75; margin-top:3px; }
        .dkpi-green  { background:linear-gradient(135deg,#059669,#047857); }
        .dkpi-blue   { background:linear-gradient(135deg,#2563eb,#1d4ed8); }
        .dkpi-orange { background:linear-gradient(135deg,#d97706,#b45309); }
        .dkpi-red    { background:linear-gradient(135deg,#dc2626,#b91c1c); }
        .dkpi-purple { background:linear-gradient(135deg,#7c3aed,#6d28d9); }
        .dkpi-teal   { background:linear-gradient(135deg,#0891b2,#0e7490); }
        .dkpi-gray   { background:linear-gradient(135deg,#6b7280,#4b5563); }
        .dkpi-pink   { background:linear-gradient(135deg,#db2777,#be185d); }
        .dchart-card { background:var(--white); border:1px solid var(--border); border-radius:10px; padding:18px; }
        .dchart-card h3 { margin:0 0 14px; font-size:13px; font-weight:700; color:#374151; }
        .dchart-wrap { position:relative; }
        .dgrid-2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:16px; }
        .dgrid-3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; margin-bottom:16px; }
        .dgrid-2-1 { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-bottom:16px; }
        .dash-table { width:100%; border-collapse:collapse; font-size:12px; }
        .dash-table th { padding:7px 10px; text-align:left; font-weight:700; font-size:11px; color:#6b7280; border-bottom:2px solid var(--border); background:var(--light); }
        .dash-table td { padding:7px 10px; border-bottom:1px solid var(--border); color:var(--dark); }
        .dash-table tr:hover td { background:var(--light); }
        .dash-badge { display:inline-block; padding:2px 8px; border-radius:12px; font-size:10px; font-weight:700; }
        .dash-badge-green  { background:#dcfce7; color:#166534; }
        .dash-badge-red    { background:#fee2e2; color:#991b1b; }
        .dash-badge-orange { background:#fef3c7; color:#92400e; }
        .dash-badge-blue   { background:#dbeafe; color:#1e40af; }
        .dash-badge-gray   { background:#f3f4f6; color:#374151; }
        .dash-progress-bar { height:8px; background:#e5e7eb; border-radius:4px; overflow:hidden; }
        .dash-progress-fill { height:100%; border-radius:4px; transition:width .4s; }
        .dash-empty { text-align:center; color:#9ca3af; padding:24px; font-size:13px; }
        @media(max-width:768px) { .dgrid-2,.dgrid-3,.dgrid-2-1 { grid-template-columns:1fr; } #dash-topbar { padding:8px 12px; } #dash-content { padding:12px; } }
        html[data-theme="dark"] .dchart-card { background:#1e293b; border-color:#334155; }
        html[data-theme="dark"] .dchart-card h3 { color:#cbd5e1; }
        html[data-theme="dark"] .dash-table th { background:#334155; color:#94a3b8; border-color:#475569; }
        html[data-theme="dark"] .dash-table td { color:#e2e8f0; border-color:#334155; }
        html[data-theme="dark"] .dash-table tr:hover td { background:#0f172a; }
        html[data-theme="dark"] #dash-topbar, html[data-theme="dark"] #dash-filters { background:#1e293b; border-color:#334155; }
        html[data-theme="dark"] .dash-tab { color:#94a3b8; border-color:#475569; }
        html[data-theme="dark"] .dash-tab:hover { background:#0f172a; color:#f1f5f9; }
        html[data-theme="dark"] #dash-filters select, html[data-theme="dark"] #dash-filters input { background:#0f172a; color:#e2e8f0; border-color:#475569; }
    </style>
</head>
<body>
    <div id="dash-topbar">
        <div class="dash-logo">
            <img src="images/logo.png" alt="SCTech">
            SCTech
        </div>
        <div class="dash-tab-bar" id="dash-tab-bar"></div>
        <a href="index.html" class="btn btn-outline btn-sm" style="white-space:nowrap;margin-left:8px">← Voltar</a>
    </div>
    <div id="dash-filters"></div>
    <div id="dash-content"></div>

    <script src="js/app.js"></script>
    <script src="js/dashboards.js"></script>
</body>
</html>
