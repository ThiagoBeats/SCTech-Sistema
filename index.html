<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dashboard - SCTech</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css">
    <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('sc_tema')||'light');document.documentElement.setAttribute('data-sidebar',localStorage.getItem('sc_sidebar')||'expanded')</script>
</head>
<body>
    <aside class="sidebar" id="main-sidebar"></aside>
    <main class="main">
        <div class="header">
            <h2>Painel de Acompanhamento</h2>
            <div style="display:flex;gap:10px;align-items:center">
                <a href="pcp.html?view=medicoes" class="btn btn-outline" style="display:flex;align-items:center;gap:7px;font-weight:600">
                    📐 Agendar Medição
                </a>
                <a href="pedido.html" class="btn btn-success" style="display:flex;align-items:center;gap:7px;font-weight:600">
                    + Novo Pedido
                </a>
            </div>
        </div>
        <div class="metrics-grid">
            <div class="metric-card" id="card-fat-mes">
                <div class="metric-icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 15.3c0 1.1 1.3 1.9 3 1.9s3-.7 3-1.9-1.4-1.6-3-2-3-.9-3-2 1.3-1.9 3-1.9 3 .8 3 1.7"/><line x1="12" y1="6" x2="12" y2="7.4"/><line x1="12" y1="16.6" x2="12" y2="18"/></svg></div>
                <div class="metric-body">
                    <div class="metric-label">Faturamento do Mês</div>
                    <div class="metric-value" id="met-fat-mes">—</div>
                </div>
            </div>
            <div class="metric-card metric-card-link" id="card-producao" onclick="filtrarMetrica('em_producao')">
                <div class="metric-icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2.1"/><circle cx="18" cy="6" r="2.1"/><circle cx="12" cy="18" r="2.1"/><line x1="7.7" y1="7.6" x2="10.6" y2="16"/><line x1="16.3" y1="7.6" x2="13.4" y2="16"/><line x1="8.1" y1="6" x2="15.9" y2="6"/></svg></div>
                <div class="metric-body">
                    <div class="metric-label">Em Produção</div>
                    <div class="metric-value" id="met-producao">—</div>
                </div>
            </div>
            <div class="metric-card metric-card-link" id="card-orcamentos" onclick="filtrarMetrica('Orçamento')">
                <div class="metric-icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v13a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M14 3v4h4"/><line x1="8" y1="12.5" x2="15" y2="12.5"/><line x1="8" y1="16" x2="15" y2="16"/></svg></div>
                <div class="metric-body">
                    <div class="metric-label">Orçamentos Abertos</div>
                    <div class="metric-value" id="met-orcamentos">—</div>
                </div>
            </div>
            <div class="metric-card" id="card-ticket">
                <div class="metric-icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v17l-2.5-1.5L13 20l-2.5-1.5L8 20l-2-1.5V3Z"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="9" y1="11.5" x2="15" y2="11.5"/></svg></div>
                <div class="metric-body">
                    <div class="metric-label">Ticket Médio</div>
                    <div class="metric-value" id="met-ticket">—</div>
                </div>
            </div>
            <div class="metric-card metric-card-alerta" id="card-estoque-critico">
                <div class="metric-icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 22 20H2Z"/><line x1="12" y1="9.5" x2="12" y2="14"/><circle cx="12" cy="17" r="0.6" fill="currentColor" stroke="none"/></svg></div>
                <div class="metric-body">
                    <div class="metric-label">Estoque Crítico</div>
                    <div class="metric-value" id="met-estoque-critico">—</div>
                </div>
            </div>
            <div class="metric-card metric-card-alerta metric-card-link" id="card-atrasados" onclick="filtrarMetrica('atrasados')">
                <div class="metric-icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="8" width="11" height="8" rx="1"/><path d="M13.5 11h3.2l3.3 3v2h-6.5"/><circle cx="7" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/></svg></div>
                <div class="metric-body">
                    <div class="metric-label">Entregas Atrasadas</div>
                    <div class="metric-value" id="met-atrasados">—</div>
                </div>
            </div>
            <div class="metric-card metric-card-link" id="card-a-receber" onclick="filtrarMetrica('a_receber')">
                <div class="metric-icon-wrap"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l2 3h6l2-3h4"/><path d="M5 12 6.5 5.5A1 1 0 0 1 7.5 4.7h9A1 1 0 0 1 17.5 5.5L19 12"/><path d="M3 12v6a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-6"/></svg></div>
                <div class="metric-body">
                    <div class="metric-label">A Receber (Total)</div>
                    <div class="metric-value" id="met-a-receber">—</div>
                </div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="card chart-card dash-alertas-card" id="card-alertas">
                <h3 style="margin:0 0 12px;color:#374151;font-size:15px;flex-shrink:0;display:flex;align-items:center;gap:8px">
                    🔔 Alertas do Sistema
                    <span id="dash-alertas-count" style="font-size:11px;font-weight:600;padding:1px 8px;border-radius:10px;background:#f3f4f6;color:#6b7280"></span>
                </h3>
                <div class="dash-alertas-scroll" id="dashboard-alertas"></div>
            </div>
            <div class="card chart-card" id="card-chart-status">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;flex-wrap:wrap">
                    <h3 style="color:#374151;font-size:15px;margin:0">Pedidos por Status</h3>
                    <select id="chart-status-filtro" onchange="renderChartStatus()" style="font-size:12px;padding:4px 8px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:#374151;cursor:pointer"></select>
                </div>
                <canvas id="chart-status"></canvas>
            </div>
        </div>

        <div id="dashboard-medicoes" style="display:none"></div>
        <div id="dashboard-instalacoes" style="display:none"></div>

        <div class="card">
            <h3 style="margin-bottom:14px;color:#374151;font-size:15px">Painel de Pedidos</h3>
            <div class="filter-bar">
                <div style="min-width:150px">
                    <label style="font-size:11px;font-weight:600;color:#6b7280;text-transform:uppercase;letter-spacing:.4px;display:block;margin-bottom:4px">Vendedor</label>
                    <select id="filtro-vendedor" onchange="renderDashboard()" style="width:100%;padding:7px 10px;border:1px solid #d1d5db;border-radius:6px;font-size:13px;background:var(--white);color:var(--dark)">
                        <option value="">Todos</option>
                    </select>
                </div>
                <button class="btn btn-outline btn-sm" onclick="salvarFiltroVendedorTela()" style="white-space:nowrap;align-self:flex-end" title="Lembrar este filtro de vendedor para a próxima vez que você abrir esta tela">💾 Salvar filtro</button>
                <input type="text" id="filtro-texto" placeholder="Buscar por ID, cliente, ambiente, telefone ou endereço…" oninput="renderDashboard()">
                <select id="filtro-status" onchange="renderDashboard()">
                    <option value="">Todos os status</option>
                    <option value="Orçamento">Orçamento</option>
                    <option value="Medição">Medição</option>
                    <option value="Aguardando Tecido">Aguardando Tecido</option>
                    <option value="Na Costura">Na Costura</option>
                    <option value="Pronto p/ Instalação">Pronto p/ Instalação</option>
                    <option value="Instalado">Instalado</option>
                    <optgroup label="Filtros especiais">
                        <option value="em_producao">Em Produção (todos ativos)</option>
                        <option value="atrasados">Entregas Atrasadas</option>
                        <option value="a_receber">Com Saldo a Receber</option>
                    </optgroup>
                </select>
                <span id="pedidos-counter" class="pedidos-counter"></span>
            </div>
            <table>
                <thead id="thead-pedidos"></thead>
                <tbody id="tb-pedidos"></tbody>
            </table>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
