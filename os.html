<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ordem de Serviço - SCTech</title>
    <link rel="icon" href="images/logo.png">
    <link rel="stylesheet" href="css/style.css?v=20261117a">
    <style>
        body { background: #E0E0E0; display: block; overflow: auto; }
        .topbar { background: var(--white); border-bottom: 1px solid var(--border); padding: 12px 30px; display: flex; justify-content: space-between; align-items: center; }
        .topbar a { color: var(--primary); text-decoration: none; font-weight: 500; font-size: 14px; }
    </style>
</head>
<body>
    <div class="topbar no-print">
        <a href="javascript:window.close()">← Fechar</a>
        <button class="btn btn-success" id="btn-enviar-doc" onclick="abrirMenuEnviar(this)">📤 Enviar</button>
        <button class="btn btn-outline" onclick="imprimirPaginaDocumento()">🖨️ Imprimir / Salvar PDF</button>
    </div>

    <div class="os-wrapper">
        <div id="os-container">
            <p style="text-align:center;color:#999;padding:40px;">Carregando OS...</p>
        </div>
    </div>

    <script src="js/etiquetas-core.js?v=20261117a"></script>
    <script src="js/etiquetas-render.js?v=20261117a"></script>
    <script src="js/cortina-desenho.js?v=20261117a"></script>
    <script src="js/docs-layout-core.js?v=20261117a"></script>
    <script src="js/financeiro-core.js?v=20261117a"></script>
    <script src="js/caixa-core.js?v=20261117a"></script>
    <script src="js/carrinho-core.js?v=20261117a"></script>
    <script src="js/resultado-core.js?v=20261117a"></script>
    <script src="js/app.js?v=20261117a"></script>
    <script src="js/compartilhar-doc.js?v=20261117a"></script>
</body>
</html>
